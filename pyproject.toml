[build-system]
requires = ["setuptools>=77", "wheel", "cffi>=1.15"]
build-backend = "setuptools.build_meta"

[project]
name = "rsyscall-ng"
version = "0.1.3"
description = "Process-independent, type-safe, low-level interface to Linux system calls: rsyscall modernized, with a clean-room Rust native side"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Carlos Andrés Planchón Prestes"}]
keywords = ["linux", "syscall", "distributed", "trio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Framework :: Trio",
    "Topic :: System :: Operating System Kernels :: Linux",
]
# outcome >= 1.3 (generic Outcome) and trio >= 0.25 (ExceptionGroup semantics) match the compat patches in python/;
# typeguard >= 4 has the check_type(value, expected_type) signature that arepl uses.
dependencies = ["cffi>=1.15", "trio>=0.25", "outcome>=1.3", "typeguard>=4"]

[project.optional-dependencies]
net = ["pyroute2"]

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"rsyscall.tasks" = ["ssh_bootstrap.sh"]
"rsyscall._native" = ["librsyscall.so", "rsyscall-bootstrap", "rsyscall-stdin-bootstrap", "rsyscall-unix-stub"]
